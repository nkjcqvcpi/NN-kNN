[project]
name = "nnknn"
version = "0.1.0"
description = "NN-kNN: shared environment for the main, rl, llm and neural-cbr worktrees"
requires-python = ">=3.14,<3.15"
dependencies = [
    # core numerics / ML. Windows (g234): Intel Arc XPU build of PyTorch.
    # Linux x86_64 (r760): the standard PyPI build of the same version (CUDA 13.2).
    "torch==2.15.0",
    "torchvision==0.29.2",
    "triton-xpu; sys_platform == 'win32'",
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "metric-learn",
    "imbalanced-learn",
    "ucimlrepo",
    "matplotlib",
    "PyYAML",
    "joblib",
    # neural-cbr: T1 benchmark
    "openml",
    "tabm",
    "catboost",
    # llm: T3 host models
    "transformers",
    "huggingface-hub",
    "lm-format-enforcer",
    # rl: environments
    "gymnasium[classic-control]",
    "ale-py",
    "MinAtar",
    "opencv-python",
    # experiment recording
    "tensorboard>=2.21.0,<2.22",
]

[dependency-groups]
dev = ["pytest"]
notebook = ["ipykernel", "ipywidgets"]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-xpu", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-xpu", marker = "sys_platform == 'win32'" }]
triton-xpu = [{ index = "pytorch-xpu", marker = "sys_platform == 'win32'" }]

[tool.uv]
package = false
default-groups = ["dev"]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
