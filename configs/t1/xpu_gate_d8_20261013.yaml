# Gate D8 of docs/T1_PREREG_20261013.md (step I, secondary XPU group): device go/no-go.
# One task, one development seed, a fixed typical raw core (no HPO on this task yet); run twice on
# the XPU with NNKNN_DETERMINISTIC=1 and once on CPU. Go only if: no device errors, the two XPU runs
# are bitwise identical, an XPU epoch costs <= 1/3 of a CPU epoch, and XPU-CPU metric differences
# stay within the development-seed spread.
base: _base.yaml
experiment: xpu_gate_d8_20261013
type: encoder_ablation
status: device_gate
seeds: [20]
core: {representation: raw, top_k: 10, lr_case: 0.01, lr_glocal: 0.01, lr_feature: 0.001, glocal_fw_set_num: 4, tau: 0.5,
       batch_size: 64, epochs: 300, patience: 40}
arms:
  - {name: raw}
reuse: {lambda_diff: 1.0, lambda_cls: 1.0, probability_mode: softmax, epochs: 300, patience: 30, lr: 0.001}
reuse_conditions: []
sync: {s_task: 0.5, retrieval_lr_scale: 0.1, w_pre: 1.0, w_post: 0.5, w_near: 0.1, v_post: 1.0, v_delta: 1.0, v_small: 0.1,
       epochs: 120, block_epochs: 2, patience: 30, probability_mode: softmax, adapter_lr: 0.001, diagnostics_every: 0}
conditions:
  - {name: alternating_default, schedule: alternating_rr}
  - {name: F0, schedule: joint_rr, joint_objective: summed, adapter_warmup_epochs: 5, retrieval_lr_scale: 1.0,
     w_post: 0.25, w_near: 0.1, v_small: 0.0, adapter_lr: 0.003}
datasets:
  - {name: tabarena_363705, task_type: regression, display: superconductivity, max_train: 5000}
