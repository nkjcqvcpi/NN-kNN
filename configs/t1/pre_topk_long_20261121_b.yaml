# Longer-budget (epochs 400, patience 60) rerun of pre_topk_expanded_20261030; same datasets, seeds and protocol. Sharded only to run in parallel.
status: exploratory_longer_budget_matched
seeds:
- 70
- 71
- 72
splits:
  test_frac: 0.2
  val_frac: 0.2
core:
  representation: raw
  glocal_fw_set_num: 1
  case_normalizer: softmax
  tau: 1.0
  top_k: 5
  bias_init: knn_mean
  bias_init_k: 5
  lr_case: 0.01
  lr_glocal: 0.01
  lr_feature: 0.001
  batch_size: 64
  epochs: 400
  patience: 60
datasets:
- name: yacht
  task_type: regression
- name: student_performance
  task_type: regression
