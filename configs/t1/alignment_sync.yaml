base: _base.yaml
experiment: alignment_sync
type: sync
status: exploratory_pilot
seeds: [5, 6, 7]
datasets:
  - {name: synthetic_diag, task_type: classification}
  - {name: iris, task_type: classification, max_train: 60}
  - {name: energy_efficiency, task_type: regression, max_train: 60}
  - {name: yacht, task_type: regression, max_train: 60}
core: {epochs: 30, patience: 15}
sync: {s_task: 0.5, retrieval_lr_scale: 0.1, w_pre: 1.0, w_post: 0.5, w_near: 0.1, v_post: 1.0, v_delta: 1.0, v_small: 0.1, epochs: 20, block_epochs: 2, patience: 20, K: 0.75, maintenance_epochs: [8, 16], probability_mode: softmax}
conditions:
  - {schedule: independent}
  - {schedule: alternating_rr}
  - {schedule: alternating_rrr}
