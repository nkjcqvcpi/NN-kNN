# Phase 5: MCB on/off with a trainable encoder, in-training checkpoint maintenance.
base: _base.yaml
experiment: p5_mcb
type: mcb
seeds: [0, 1, 2, 3, 4]
datasets:
  - {name: synthetic_diag, task_type: classification}
  - {name: breast_cancer, task_type: classification}
  - {name: digits, task_type: classification}
  - {name: wine, task_type: classification}
core: {representation: mlp, mlp_dims: [32, 16], mcb_momentum: 0.99, epochs: 200, patience: 40}   # PILOT momentum
maintenance_epochs: [50, 100, 150]
conditions:
  - {mcb: false, policy: trust_utility_coverage, K: 0.5}
  - {mcb: true, policy: trust_utility_coverage, K: 0.5}
  - {mcb: false, policy: random, K: 0.5}
  - {mcb: true, policy: random, K: 0.5}
