# Review 2026-11-24 (problem A3): mask_joint_pilot_20261030 with the retrieval pretrain budget raised from 300/40 to
# 600/60 epochs/patience; everything else identical. In mask_joint_r760 the all-case pretrain ran to the 300-epoch cap
# on 12 of 18 runs (energy, iris, wine, yacht: every seed), the masked one on 0 of 18, so a negative selected drift of
# all-case joint training can be continued convergence.
status: exploratory_review_20261124_mask_joint_long_pretrain
seeds:
- 70
- 71
- 72
splits:
  test_frac: 0.2
  val_frac: 0.2
core:
  representation: raw
  glocal_fw_set_num: 1
  case_normalizer: softmax
  tau: 1.0
  top_k: 5
  bias_init: knn_mean
  bias_init_k: 5
  lr_case: 0.01
  lr_glocal: 0.01
  lr_feature: 0.001
  batch_size: 64
  epochs: 600
  patience: 60
sync:
  schedule: joint_rr
  joint_objective: summed
  w_pre: 1.0
  w_post: 0.5
  w_near: 0.0
  v_post: 1.0
  v_delta: 1.0
  v_small: 0.1
  adapter_lr: 0.003
  hidden_dims:
  - 64
  - 32
  adapter_warmup_epochs: 5
  epochs: 85
  patience: 20
  diagnostics_every: 0
  early_stopping: val_L_post
classification_score_scale: 10.0
datasets:
- name: iris
  task_type: classification
- name: wine
  task_type: classification
- name: breast_cancer
  task_type: classification
- name: yacht
  task_type: regression
- name: energy_efficiency
  task_type: regression
- name: student_performance
  task_type: regression
