  max_train: 3000
- name: wine
  task_type: regression
  max_train: 3000
- name: tabarena_363631
  task_type: regression
  max_train: 3000
- name: tabarena_363686
  task_type: regression
  max_train: 3000
- name: tabarena_363693
  task_type: regression
  max_train: 3000
- name: tabarena_363705
  task_type: regression
  max_train: 3000
protocol:
  finetune_epochs: 30
  finetune_lr_scale: 0.1
core:
