  finetune_epochs: 30
  finetune_lr_scale: 0.1
core:
  pre_topk_mask: true
retention:
  tie_break: seeded_random
K:
- 0.5
conditions:
- policy: full_memory
- policy: random
- policy: provenance_only
- policy: bias_current
