# Phase 4: independent vs retrieval-reuse vs retrieval-reuse-retain synchronization.
base: _base.yaml
experiment: p4_sync
type: sync
seeds: [0, 1, 2, 3, 4]
datasets:
  - {name: synthetic_diag, task_type: classification}
  - {name: iris, task_type: classification}
  - {name: wine, task_type: classification}
  - {name: breast_cancer, task_type: classification}
  - {name: balance, task_type: classification}
  - {name: digits, task_type: classification}
  - {name: zebra, task_type: classification}
  - {name: zebra_special, task_type: classification}
sync:
  s_task: 0.5            # PILOT free-correction scale
  w_pre: 1.0             # PILOT loss weights (every term is also logged separately)
  w_post: 0.5
  w_near: 0.1
  v_post: 1.0
  v_delta: 1.0
  v_small: 0.1
  epochs: 120
  block_epochs: 2
  patience: 30
  K: 0.5
  maintenance_epochs: [40, 80]
  probability_mode: softmax
conditions:
  - {schedule: independent}
  - {schedule: alternating_rr}
  - {schedule: alternating_rrr}
