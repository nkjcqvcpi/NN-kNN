# Phase 2: classification reuse (aggregate label-conditioned NN-CDH), retrieval frozen.
base: _base.yaml
experiment: p2_reuse
type: reuse
seeds: [0, 1, 2, 3, 4]
datasets:
  - {name: synthetic_diag, task_type: classification}
  - {name: iris, task_type: classification}
  - {name: wine, task_type: classification}
  - {name: breast_cancer, task_type: classification}
  - {name: balance, task_type: classification}
  - {name: digits, task_type: classification}
  - {name: zebra, task_type: classification}
  - {name: zebra_special, task_type: classification}
reuse: {lambda_diff: 1.0, lambda_cls: 1.0, probability_mode: softmax, epochs: 300, patience: 30, lr: 0.001}   # PILOT lambdas / probability protocol
conditions:
  - {output_mode: nominal_residual_scores, loss: combined}
  - {output_mode: nominal_residual_scores, loss: diff_only}
  - {output_mode: nominal_residual_scores, loss: cls_only}
  - {output_mode: logit_residual, loss: combined}
  - {output_mode: logit_residual, loss: diff_only}
  - {output_mode: logit_residual, loss: cls_only}
