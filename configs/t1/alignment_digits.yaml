# Repeat the affected fine-tuning path with the starting validation state eligible.
base: _base.yaml
experiment: alignment_digits
type: retention
status: exploratory_pilot
seeds: [0, 1]
datasets: [{name: digits, task_type: classification}]
protocol: {finetune_epochs: 30, finetune_lr_scale: 0.1}
K: [0.5]
conditions:
  - {policy: full_memory}
  - {policy: random}
  - {policy: provenance_only}
  - {policy: bias_normalized}
