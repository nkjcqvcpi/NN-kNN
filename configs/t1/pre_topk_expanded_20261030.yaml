# All datasets chosen before inspecting this batch; same protocol as the initial pilot.
status: exploratory_expanded_pilot
seeds: [70, 71, 72]
splits: {test_frac: 0.2, val_frac: 0.2}
core:
  representation: raw
  glocal_fw_set_num: 1
  case_normalizer: softmax
  tau: 1.0
  top_k: 5
  bias_init: knn_mean
  bias_init_k: 5
  lr_case: 0.01
  lr_glocal: 0.01
  lr_feature: 0.001
  batch_size: 64
  epochs: 120
  patience: 20
datasets:
  - {name: linear_regression, task_type: regression, generator: {n: 400, d: 5, noise_scale: 1.0}}
  - {name: yacht, task_type: regression}
  - {name: energy_efficiency, task_type: regression}
  - {name: iris, task_type: classification}
  - {name: wine, task_type: classification}
  - {name: breast_cancer, task_type: classification}
  - {name: balance, task_type: classification}
  - {name: digits, task_type: classification}
  - {name: airfoil, task_type: regression}
  - {name: student_performance, task_type: regression}
  - {name: mixture_two_linear_models, task_type: regression, generator: {n: 400, d: 4, noise_scale: 0.5}}
  - {name: redundant_features, task_type: regression, generator: {n: 400, noise_scale: 0.1}}
