base: _base.yaml
experiment: alignment_adapted_candidates
type: reuse_retention
status: exploratory_smoke
seeds: [0, 1]
datasets: [{name: iris, task_type: classification, max_train: 60}]
core: {epochs: 20, patience: 10}
reuse: {output_mode: nominal_residual_scores, loss: combined, lambda_diff: 1.0, lambda_cls: 1.0, probability_mode: softmax, epochs: 20, patience: 10}
protocol: {finetune_epochs: 0}
K: [0.75]
conditions:
  - {policy: full_memory}
  - {policy: provenance_only}
  - {policy: bias_normalized}
  - {policy: coverage_reachability}
  - {policy: removal_influence}
  - {policy: removal_cached}
