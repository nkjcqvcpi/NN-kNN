# Transfer group of docs/T1_PREREG_20261013.md: the five-family HPO grid of the full study on ten
# harder TabArena tasks, training stream capped at 3,000 rows for every family. Neural CBR is
# never tuned on these tasks; its cores come from this grid's NN-kNN selection.
