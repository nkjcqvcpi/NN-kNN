# Handoff 2026-11-26 pack p0 item (a): exploratory, our choice, not a PI decision.
# B transformation with bias_source delta_from_init, the case bias minus its build-time value. Until now the store's
# initial bias was seeded at the first audit after core training (b - b_init = 0 for every case); the opt-in
# statistics.initial_bias: build_time seeds it with the bias build_model gave every case (knn_mean rule).
# Copy of configs/t1/handoff_20261125b/bnorm_medianmad_classification.yaml (plan_full_r760 retention__classification: tuned masked
# cores, finetune 30 at 0.1, K 0.2/0.5/0.75, condition bias_normalized) except experiment, status,
# statistics.bias_normalization median_mad, bias_source delta_from_init and initial_bias build_time.
# Compared with the handoff_btransform_r760 bnorm_medianmad rows (median/MAD, bias_source current), same seeds 30-32 and host.
# Expected outcome (stated before running): build_model gives every case the same initial bias, so b - b_init is
# one constant shift of b; within-cohort percentiles are unchanged exactly and median/MAD scores up to rounding,
# so the kept sets should equal the reference's. The run checks this end to end on the recorded pipeline.
# Hosts (one per dataset, those of the plan_full retention and btransform rows): q-lab: balance, breast_cancer, digits, tabarena_363614, tabarena_363626; xps8960: iris, wine, zebra, zebra_special, synthetic_diag. Study handoff_deltainit_r760.
