# Handoff 2026-11-26 pack p1 (exploratory, our choice, not a PI decision; see DECLARATION.md): all-case twin of the plan_full_r760 config
# results/t1/plan_full_r760/plan/configs/sync_mcb__regression__energy_efficiency.yaml (group sync_mcb, tools/t1_execute_study.py).
# Identical except status, seeds 30-32 and core.pre_topk_mask false; no core_by_dataset (plan_full trains this group on the untuned _base core on purpose: same representation in every arm), so only pre_topk_mask is switched.
# Experiment name unchanged (sync_mcb__regression), study handoff_allcaseplan_r760, so every unit pairs with the plan_full
# unit of the same path; run on the host that recorded that plan_full experiment and dataset.
status: exploratory_handoff_20261126_p1_allcaseplan
specification_commit: cd77277600841438d98ac5793867da28b8ec6dd0
pipeline_revision: pi_20260920_v2
torch_threads: 1
splits:
  test_frac: 0.2
  val_frac: 0.2
  maint_frac: 0.0
  reg_cohort_bins: 5
core:
  representation: mlp
  glocal_fw_set_num: 1
  tau: 1.0
  top_k: 5
  pre_topk_mask: false
  case_normalizer: softmax
  lr_case: 0.01
  lr_glocal: 0.01
  lr_feature: 0.001
  epochs: 300
  patience: 40
  batch_size: 32
  bias_init: knn_mean
  bias_init_k: 5
  mlp_dims:
  - 32
  - 16
  mcb_enabled: true
  mcb_momentum: 0.99
  normalize_embeddings: true
statistics:
  source: train_loo
  accumulation: per_checkpoint
  counterfactual: false
  smoothing: 1.0
  min_retrieval_count: 2
  min_activation_mass: 0.1
  bias_normalization: within_cohort_percentile
  bias_source: current
  regression_success_tolerance: 0.5
retention:
  policy: provenance_only
  min_per_cohort: 2
  protect_rare_cohort_below: 0
  boundary_protect_fraction: 0.0
  activation_threshold: 0.05
  zero_reachability: zero
  cache_activation_threshold: 0.05
  allowed_loss_increase: 0.05
experiment: sync_mcb__regression
type: sync
seeds:
- 30
- 31
- 32
datasets:
- name: energy_efficiency
  task_type: regression
sync:
  s_task: 0.5
  retrieval_lr_scale: 0.1
  w_pre: 1.0
  w_post: 0.5
  w_near: 0.1
  v_post: 1.0
  v_delta: 1.0
  v_small: 0.1
  epochs: 120
  block_epochs: 2
  patience: 30
  K: 0.75
  maintenance_epochs:
  - 40
  - 80
  probability_mode: softmax
  free_radius_method: trained_bias_region
conditions:
- schedule: independent
- schedule: alternating_rr
- schedule: alternating_rrr
- name: rr_no_L_pre
  schedule: alternating_rr
  w_pre: 0.0
- name: rr_no_L_near
  schedule: alternating_rr
  w_near: 0.0
- name: rr_no_L_delta
  schedule: alternating_rr
  v_delta: 0.0
- name: rr_no_L_small
  schedule: alternating_rr
  v_small: 0.0
- name: rr_zero_radius
  schedule: alternating_rr
  free_radius_method: zero
- name: rr_initial_bias_radius
  schedule: alternating_rr
  free_radius_method: initial_bias_region
- name: rr_exact_kth_radius
  schedule: alternating_rr
  free_radius_method: exact_kth_pair
capacity_match:
  K: 0.75
  policy: provenance_only
