# Handoff 2026-11-26 pack p1 (exploratory, our choice, not a PI decision; see DECLARATION.md): all-case twin of the plan_full_r760 config
# results/t1/plan_full_r760/plan/configs/nominal_reuse__classification__synthetic_nominal.yaml (group nominal_reuse, tools/t1_execute_study.py).
# Identical except status, seeds 30-32 and core.pre_topk_mask false; no core_by_dataset (plan_full trains this group on the untuned _base core on purpose: same representation in every arm), so only pre_topk_mask is switched.
# Experiment name unchanged (nominal_reuse__classification), study handoff_allcaseplan_r760, so every unit pairs with the plan_full
# unit of the same path; run on the host that recorded that plan_full experiment and dataset.
status: exploratory_handoff_20261126_p1_allcaseplan
specification_commit: cd77277600841438d98ac5793867da28b8ec6dd0
pipeline_revision: pi_20260920_v2
torch_threads: 1
splits:
  test_frac: 0.2
  val_frac: 0.2
  maint_frac: 0.0
  reg_cohort_bins: 5
core:
  representation: raw
  glocal_fw_set_num: 1
  tau: 1.0
  top_k: 5
  pre_topk_mask: false
  case_normalizer: softmax
  lr_case: 0.01
  lr_glocal: 0.01
  lr_feature: 0.001
  epochs: 300
  patience: 40
  batch_size: 32
  bias_init: knn_mean
  bias_init_k: 5
statistics:
  source: train_loo
  accumulation: per_checkpoint
  counterfactual: false
  smoothing: 1.0
  min_retrieval_count: 2
  min_activation_mass: 0.1
  bias_normalization: within_cohort_percentile
  bias_source: current
  regression_success_tolerance: 0.5
retention:
  policy: provenance_only
  min_per_cohort: 2
  protect_rare_cohort_below: 0
  boundary_protect_fraction: 0.0
  activation_threshold: 0.05
  zero_reachability: zero
  cache_activation_threshold: 0.05
  allowed_loss_increase: 0.05
experiment: nominal_reuse__classification
type: reuse
seeds:
- 30
- 31
- 32
datasets:
- name: synthetic_nominal
  task_type: classification
reuse:
  lambda_diff: 1.0
  lambda_cls: 1.0
  probability_mode: softmax
  epochs: 30
  patience: 15
  lr: 0.001
  hidden_dims:
  - 32
  - 16
  nominal_fields_covered_by_representation: false
  nominal_fields:
  - name: color
    covered_by_representation: false
  - name: shape
    covered_by_representation: false
  - name: size
    covered_by_representation: true
conditions:
- output_mode: nominal_residual_scores
  loss: combined
- output_mode: nominal_residual_scores
  loss: diff_only
- output_mode: nominal_residual_scores
  loss: cls_only
- output_mode: logit_residual
  loss: combined
- output_mode: logit_residual
  loss: diff_only
- output_mode: logit_residual
  loss: cls_only
