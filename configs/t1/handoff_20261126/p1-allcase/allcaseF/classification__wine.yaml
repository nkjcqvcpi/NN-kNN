# Handoff 2026-11-26 pack p1 (the revised all-case baseline, declared by us: exploratory, our choice, not a PI decision; see DECLARATION.md).
# F pipeline of the frozen confirm_final_20261013/classification__wine.yaml with the declaration applied: pre_topk_mask false in core
# and core_by_dataset; core_by_dataset = the validation-selected winner of review_gridallcase_r760 for this task
# (candidate 1f47071a1a1f05e1: representation mlp, tau 1.0, lr_case 0.01,
# glocal_fw_set_num 1, top_k 10 (inert under all-case), with the grid's batch 64 and
# lr_glocal/lr_feature rule), recomputed from the recorded trial units; core epochs/patience 300/40, sync schedule and loss
# weights exactly as the frozen F; correction-size penalty = the recorded default (trained_bias_region allowance);
# no F_zero_radius or F_no_penalty arm: frozen F has v_small 0 here, so F is itself the no-penalty condition and the zero-radius variant would train the same model.
# The alternating_default_matched and F_global arms of the frozen file are left out (not part of the declaration);
# retrieval_only and the frozen-core reuse arm are kept (matched retrieval-only and retrieval-plus-adapter baselines).
# Seeds 50-52 (owner's order; in the prereg they are evaluation_small_tasks seeds, never run for T1 F before).
# Study handoff_allcaseF_r760; paired per seed with maskedF/classification__wine.yaml (same host, same splits) and with the kNN, MLP,
# CatBoost and TabM baselines (t1_grid_search.py evaluate of their recorded selections, seeds 50-52).
base: ../../../_base.yaml
experiment: allcaseF_20261126
type: encoder_ablation
status: exploratory_handoff_20261126_p1_allcaseF
seeds:
- 50
- 51
- 52
core:
  representation: raw
  glocal_fw_set_num: 1
  tau: 1.0
  top_k: 5
  pre_topk_mask: false
  case_normalizer: softmax
  lr_case: 0.01
  lr_glocal: 0.01
  lr_feature: 0.001
  epochs: 300
  patience: 40
  batch_size: 32
  bias_init: knn_mean
  bias_init_k: 5
sync:
  s_task: 0.5
  retrieval_lr_scale: 0.1
  w_pre: 1.0
  w_post: 0.5
  w_near: 0.1
  v_post: 1.0
  v_delta: 1.0
  v_small: 0.1
  epochs: 120
  block_epochs: 2
  patience: 30
  probability_mode: softmax
  adapter_lr: 0.001
  diagnostics_every: 0
reuse:
  lambda_diff: 1.0
  lambda_cls: 1.0
  probability_mode: softmax
  epochs: 300
  patience: 30
  lr: 0.001
reuse_conditions:
- output_mode: nominal_residual_scores
  loss: combined
  score_scale: 10.0
statistics:
  source: train_loo
  accumulation: per_checkpoint
  counterfactual: false
  smoothing: 1.0
  min_retrieval_count: 2
  min_activation_mass: 0.1
  bias_normalization: within_cohort_percentile
  bias_source: current
  regression_success_tolerance: 0.5
splits:
  test_frac: 0.2
  val_frac: 0.2
  maint_frac: 0.0
  reg_cohort_bins: 5
arms:
- name: tuned
datasets:
- name: wine
  task_type: classification
core_by_dataset:
  classification__wine:
    pre_topk_mask: false
    representation: mlp
    top_k: 10
    lr_case: 0.01
    glocal_fw_set_num: 1
    tau: 1.0
    batch_size: 64
    lr_glocal: 0.01
    lr_feature: 0.001
core_selection_source:
  classification__wine: r760:/mnt/largedata/NN-KNN/neural-cbr/results/t1/review_gridallcase_r760/classification__wine/classification__wine/nnknn/selection.json
conditions:
- schedule: joint_rr
  joint_objective: summed
  adapter_warmup_epochs: 5
  retrieval_lr_scale: 1.0
  w_post: 0.25
  w_near: 0.1
  v_small: 0.0
  adapter_lr: 0.003
  name: F
  score_scale: 10.0
