# Handoff 2026-11-26 pack p0 item (f): bias-initialization K. Every value chosen here is exploratory, our choice, not a PI decision (owner's order 2026-11-26).
# configs/t1/pre_topk_expanded_20261030.yaml (raw core, 120/20, top_k 5, 12 datasets, seeds 70-72) unchanged except
# status and core.bias_init_k 3 (recorded 5). Run by tools/t1_pre_topk_pilot.py, which fits both arms (masked and
# all_cases) from one paired initialization; the all-case arm is the comparison asked for, the masked arm comes along.
# Compared with the all_cases units of study pretopk_expanded_r760 (bias_init_k 5).
# Host: xps8960 (pretopk_expanded_r760 was recorded there for all 12 datasets). Study handoff_bik3_r760.
status: exploratory_handoff_20261126_p0
seeds:
- 70
- 71
- 72
splits:
  test_frac: 0.2
  val_frac: 0.2
core:
  representation: raw
  glocal_fw_set_num: 1
  case_normalizer: softmax
  tau: 1.0
  top_k: 5
  bias_init: knn_mean
  bias_init_k: 3
  lr_case: 0.01
  lr_glocal: 0.01
  lr_feature: 0.001
  batch_size: 64
  epochs: 120
  patience: 20
datasets:
- name: linear_regression
  task_type: regression
  generator:
    n: 400
    d: 5
    noise_scale: 1.0
- name: yacht
  task_type: regression
- name: energy_efficiency
  task_type: regression
- name: iris
  task_type: classification
- name: wine
  task_type: classification
- name: breast_cancer
  task_type: classification
- name: balance
  task_type: classification
- name: digits
  task_type: classification
- name: airfoil
  task_type: regression
- name: student_performance
  task_type: regression
- name: mixture_two_linear_models
  task_type: regression
  generator:
    n: 400
    d: 4
    noise_scale: 0.5
- name: redundant_features
  task_type: regression
  generator:
    n: 400
    noise_scale: 0.1
