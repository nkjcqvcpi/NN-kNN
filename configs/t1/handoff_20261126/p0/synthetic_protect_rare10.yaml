# Handoff 2026-11-26 pack p0 item (b): rare-cohort protection. Every value chosen here is exploratory, our choice, not a PI decision (owner's order 2026-11-26).
# Answers T1_IMPLEMENTATION_HANDOFF stage 1 ("Mark protected cases required for minimum class/action/cohort coverage")
# and the checklist item "Define coverage floors and protection rules for ... rare ... cases".
# configs/t1/handoff_20261125b/synthetic_retention.yaml (plan_full retention, synthetic_diag form: untuned _base core,
# masked, 300/40, finetune 30 at 0.1, K 0.2/0.5/0.75, seeds 30-32, the 7 synthetic factor sets) with
# retention.protect_rare_cohort_below 10 (plan_full 0) and the conditions of handoff_protect_r760 (random, bias_current,
# provenance_only, coverage_reachability). Value 10: our choice (the 2026-11-25 gap list's suggestion).
# Expected no-op, stated before running: cohorts are classes, and the smallest training class of these sets over seeds
# 30-32 has 118 cases (synthetic_noise s31), so no cohort has <= 10 cases, nothing is protected and every selection equals
# the matching synthetic_retention unit (protection_requirements only adds protected cases; nothing else reads the key).
# Host: r760 (revision_stress and handoff_synret rows of these sets). Study handoff_protect_r760.
status: exploratory_handoff_20261126_p0
