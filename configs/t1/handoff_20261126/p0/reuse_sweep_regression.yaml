# Handoff 2026-11-26 pack p0 item (c): reuse loss weights, regression. Every value chosen here is exploratory, our choice, not a PI decision (owner's order 2026-11-26).
# plan_full_r760 reuse_regression unchanged (tuned cores, masked core, adapter 300/30/0.001) except experiment, status,
# seeds 30-32 and the conditions: combined loss with (lambda_diff, lambda_cls) in (1, 0.3), (0.3, 1), (3, 1), (1, 3).
# output_mode stays nominal_residual_scores as in plan_full (regression uses the aggregate residual adapter and ignores
# output_mode and probability_mode, so no probability-mode twin is written).
# Stated before running: in model/t1/reuse.py regression_adapter_losses, L_diff = MSE(final - p0, y - p0) equals
# L_cls = MSE(final, y), so every pair only rescales one loss by lambda_diff + lambda_cls; with Adam this is expected to
# change the outcome little (Adam eps and the early-stopping tolerance 1e-9 on the scaled loss are the only paths).
# Hosts (one per dataset, the hosts of the plan_full reuse_regression rows): r760: abalone, car, wine; xps8960: airfoil, body_fat, diabets, yacht; q-lab: energy_efficiency, student_performance, tabarena_363625, tabarena_363675.
