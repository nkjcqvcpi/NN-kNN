# Handoff 2026-11-26 pack p0 item (b), real task: rare-cohort protection. Every value chosen here is exploratory, our choice, not a PI decision (owner's order 2026-11-26).
# plan_full_r760 retention__classification (tuned core from core_by_dataset, masked, 300/40, finetune 30 at 0.1,
# K 0.2/0.5/0.75) on tabarena_363614 (anneal) unchanged except experiment, status, seeds 30-32,
# retention.protect_rare_cohort_below 10 (plan_full 0) and the conditions random, bias_current, provenance_only and
# coverage_reachability (as in handoff_protect_r760). Value 10: our choice.
# Why this task: it is the only plan_full task with a cohort of <= 10 training cases (one class has 4-5 cases over
# seeds 30-32; every other plan_full classification class and regression bin has >= 28), so here the protection binds
# (synthetic_protect_rare10.yaml is a proven no-op).
# Compared with the recorded plan_full retention__classification units of the same policies and K.
# Host: q-lab (every plan_full retention row of tabarena_363614 was recorded there). Study handoff_protect_r760.
