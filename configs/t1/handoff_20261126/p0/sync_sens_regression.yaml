# Handoff 2026-11-26 pack p0 item (d): synchronization sensitivity. Every value chosen here is exploratory, our choice, not a PI decision (owner's order 2026-11-26).
# Answers the plan's open free-correction settings (T1_FULL_CYCLE_IMPLEMENTATION_PLAN: "The exact rule for choosing
# t_star, d_y ..., s_task, and robust versus arithmetic aggregation remains unresolved"; checklist "Select s_task").
# plan_full_r760 synchronization__regression unchanged (tuned cores, masked core, sync 120 epochs, block 2, patience 30,
# capacity match K 0.75 provenance_only, so every label ends in _matched_K0.75) except experiment, status, seeds 30-32
# and the conditions, each a one-key change of the recorded alternating_rr (s_task 0.5, trained_bias_region, mean,
# identity) or rr_zero_radius:
# - s_task 0.25 and 1.0 with alternating_rr and with rr_zero_radius (L_small is squared L2 from zero there);
# - the allowance settings calibrate_free_radius exposes besides the recorded radius methods: radius_aggregation median,
#   bias_transform shrunk (shrink_factor 0.5) and clipped (clipping_quantile 0.95), both the code defaults;
# bias_transform cohort_normalized is left out: calibrate_free_radius takes the cohorts without regression bins, so every regression case is in one cohort and the transform equals identity.
# - t*: the runner has no separate t* key; t* is the selected core epoch, and the only other value it can take is 0 with
#   core_pretrain false (rr_tstar0_no_pretrain), which also drops the core pretraining (retrieval and adapter then train
#   together from the untrained initialization for the 120 sync epochs). It is therefore not a pure t* comparison.
# Compared with the recorded plan_full alternating_rr and rr_zero_radius units.
# Hosts (one per dataset, the hosts of the plan_full synchronization rows): r760: abalone, car, wine; xps8960: airfoil, body_fat, diabets, yacht; q-lab: energy_efficiency, student_performance, tabarena_363625, tabarena_363675.
