# Handoff 2026-11-26 pack p0 item (c): reuse loss weights and probability mode. Every value chosen here is exploratory, our choice, not a PI decision (owner's order 2026-11-26).
# Answers the plan's open adapter settings (plan 5.4: combined loss lambda_diff * L_diff + lambda_cls * L_cls; recorded
# PILOT values lambda_diff = lambda_cls = 1, probability_mode softmax).
# plan_full_r760 reuse_classification unchanged (tuned cores, masked core: pre_topk_mask true, 300/40; adapter 300
# epochs, patience 30, lr 0.001) except experiment, status, seeds 30-32 and the conditions:
# - combined loss with (lambda_diff, lambda_cls) in (1, 0.3), (0.3, 1), (3, 1), (1, 3) for both output modes
#   (nominal_residual_scores, logit_residual); per-condition keys override the reuse block (Runner.reuse_condition);
# - probability_mode clip_normalize (the only other mode model/t1/reuse.py supports) for the three recorded
#   nominal_residual_scores losses. It changes only how s_q becomes probabilities (NLL/ECE/Brier and the argmax only when
#   every score is <= 0); training is identical. logit_residual ignores probability_mode, so it has no such twin.
# Compared with the recorded plan_full combined/diff_only/cls_only units (lambda 1/1, softmax).
# Hosts (one per dataset, the hosts of the plan_full reuse_classification rows): q-lab: balance, breast_cancer, digits, tabarena_363614, tabarena_363626; xps8960: iris, wine, zebra, zebra_special, synthetic_diag.
