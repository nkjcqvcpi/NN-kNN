  glocal_fw_set_num: 1
  tau: 1.0
  top_k: 5
  pre_topk_mask: true
  case_normalizer: softmax
  lr_case: 0.01
  lr_glocal: 0.01
  lr_feature: 0.001
  epochs: 300
