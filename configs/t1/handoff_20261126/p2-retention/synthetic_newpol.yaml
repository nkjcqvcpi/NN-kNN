# Handoff 2026-11-26 pack p2: the 7 established-method and data-valuation policies on the 7 synthetic factor sets
# (reference, overlap, noise, redundant, uncovered_rare, shift, combined; generator independent_v1).
# configs/t1/handoff_20261125b/synthetic_retention.yaml (study handoff_synret_r760: untuned _base core, masked, 300/40,
# finetune 30 at 0.1, K 0.2/0.5/0.75, seeds 30-32) unchanged except experiment, status, conditions, the retention keys
# below and the opt-in efficiency and reliability blocks. Pairs with the 8 policies of handoff_synret_r760.
# Declared choices (exploratory, our choice, not a PI decision; model/t1/baselines.py documents each method):
# - the 7 policies rc_cnn, crr, bbnr, enn, energy_compress, knn_shapley, loo_value at the plan_full budgets K 0.2/0.5/0.75
#   with the plan_full protection (min_per_cohort 2) and tie-break (case_id); protected cases and floors are kept first;
# - 'retrieved' = activation > retention.activation_threshold (the plan_full 0.05 of coverage_reachability), read by
#   rc_cnn, crr, bbnr; 'solves' = retrieved and the case's stored answer agrees with the query;
# - enn and bbnr: retention.fill_policy random (the existing random policy's seeded order) inside the kept and the
#   edited/deleted groups;
# - energy_compress: sequential deletion to K (fixed budget instead of the paper's best visited case base);
# - knn_shapley: K = the core's top_k, cases ordered by the learned retrieval score; loo_value: final-prediction loss
#   (nll / squared error) on the full memory, one pass;
# - efficiency (eff_* scalars per unit): lookup_repeats 5, single_queries 50 (median wall time of single-query and
#   whole-test-set lookups of the maintained and the full-memory core, case-memory bytes, maintenance seconds);
# - energy_compress classification hinge margin retention.energy_margin 0.2 (the survey's worked example);
# - reliability (one ch_reliability unit per dataset and seed, on the same trained core, after the policy units):
#   C, H, Q and the provenance_only rank recomputed on nested random subsets of the maintenance reference queries,
#   fractions 0.1/0.25/0.5/1.0, 5 repeats, Spearman and top/bottom decile (0.1) overlap with the full set.
# Host: r760 (handoff_synret_r760 and revision_stress rows of these sets). Study handoff_synnewpol_r760.
status: exploratory_handoff_20261126_p2
specification_commit: cd77277600841438d98ac5793867da28b8ec6dd0
pipeline_revision: pi_20260920_v2
torch_threads: 1
splits:
