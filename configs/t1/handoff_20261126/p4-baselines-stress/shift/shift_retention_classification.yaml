# Handoff 2026-11-26 pack p4 (b), TabArena shift stress protocol declared by us (exploratory, our choice, not a PI decision).
# plan_full_r760 retention__classification unchanged (tuned masked cores, 300/40, finetune 30 at 0.1, statistics, protection, the 8
# plan_full policies) except experiment shift_retention__classification, status, seeds 30-32, K 0.5 only, the 9 real
# plan_full tasks (synthetic_diag is left out: its generator has a fixed design and its own shifted test group) and the split:
# Covariate-shift split (exploratory, our choice, not a PI decision): splits.split_mode covariate_pc1, shift_quantile 0.7 (model/t1/data.py
# make_splits): training side = the rows in the lower 70 % of the first principal component of the standardized numeric
# features (all rows, column-median imputation, constant columns dropped, sign: largest loading positive), test = the upper
# 30 %; validation = val_frac / (1 - test_frac) = 25 % of the training side (seeded, stratified where possible); OpenML
# outer splits are not used. Test groups shift_near / shift_far (lower / upper half of the test rows by PC1) are recorded.
# Study handoff_shift_r760. Hosts (the plan_full retention host of each task): q-lab: balance, breast_cancer, digits, tabarena_363614, tabarena_363626, energy_efficiency, student_performance, tabarena_363625, tabarena_363675; xps8960: iris, wine (classification), zebra, zebra_special, body_fat, diabets, yacht; r760: abalone, airfoil, car, wine (regression).
