# Handoff 2026-11-26 pack p4 (a), exploratory, our choice, not a PI decision: TabPFN v2 as an extra comparator of the baselines grid
# (tools/t1_grid_search.py family tabpfn, model/t1/tabpfn_baseline.py), evaluation seed 51 (one file per seed, so one
# job per task and seed; the trial units do not depend on the file's seed list). Datasets and splits are those of
# grid_search_20261009.yaml (the recorded baselines grid of these
# confirmation tasks), so a seed gives exactly the recorded baselines' split; seeds 50-52 are those of the p1 matched
# baselines (kNN, MLP, CatBoost, TabM evaluate) and of maskedF/allcaseF. Declared choices: package tabpfn 10.2.0, model v2
# (the Nature 2025 model; later versions are gated), the pinned default v2 checkpoints, n_estimators 4, CPU, one thread,
# ignore_pretraining_limits true, random_state = seed, no HPO (selection: fixed, one candidate), regime at most 3000
# training rows, 500 features, 10 classes; refit_epochs / refit_patience 0 are recorded in each trial's config and unused
# (nothing is trained). Excluded (training stream above 3000 rows): regression__car, regression__wine.
