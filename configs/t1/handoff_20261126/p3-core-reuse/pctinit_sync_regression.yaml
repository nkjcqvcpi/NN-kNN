# Handoff 2026-11-26 pack p3. Every value chosen here is exploratory, our choice, not a PI decision (owner's order 2026-11-26).
# Item (a) on the plan_full synchronization tasks: the learned-distance percentile bias initializer (core
# bias_init learned_distance_percentile; b_default^(0) = a percentile of all ordered non-self learned case-case
# distances at initialization) as three arms pct10/pct25/pct50 (core overrides; each arm trains its own core stage).
# plan_full_r760 synchronization__regression unchanged (tuned cores per dataset, masked core, sync 120 epochs, block 2,
# patience 30, capacity match K 0.75 provenance_only, s_task 0.5) except experiment, status, seeds 30-32, the arms and
# the conditions, reduced to the three recorded ones the initializer can change: independent, alternating_rr and
# rr_initial_bias_radius (its free radius is the initial-bias region itself). Labels are <arm>__<condition>_matched_K0.75.
# Compared with the recorded plan_full units of the same conditions (knn_mean k 5) on the same hosts.
# Hosts (one per dataset, those of the plan_full synchronization rows): q-lab: energy_efficiency, student_performance, tabarena_363625, tabarena_363675; r760: abalone, car, wine; xps8960: airfoil, body_fat, diabets, yacht.
