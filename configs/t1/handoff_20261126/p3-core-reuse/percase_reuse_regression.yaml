# Handoff 2026-11-26 pack p3. Every value chosen here is exploratory, our choice, not a PI decision (owner's order 2026-11-26).
# Item (b): the historical 2022 per-case adapter as an opt-in reuse output mode (T1_IMPLEMENTATION_HANDOFF
# "Classification-adapter baselines and ablations" item 2: "the 2022-style single-case or per-case nominal-difference
# adapter as a historical ablation where feasible"; T1_FULL_CYCLE_NNKNN: "The maintained code implements aggregate and
# per-case adapter variants"). It receives the retrieved problem context z_i, which the v0 aggregate design excludes:
# it is the historical reference, not the v0 design.
# Declared per-case design (model/t1/reuse_variants.py, output_mode per_case_2022): every retrieved case i
# (a_qi > 0) is adapted separately, r_i = tanh(g([z_i, e(u_i), z_q - z_i, e(u_q) - e(u_i)])) for classification
# (target e(y_q) - e(y_i), the 2022 one-hot/one-cold solution difference under the plus-sign convention; e(u) only for
# nominal fields the representation does not cover) and dy_i = g([z_i, z_q - z_i]) for regression (the maintained
# NNCDHAdapter pair net, target y_q - y_i); the adapted case solutions are combined with the retrieval activations,
# s_q = sum_i a_qi (e(y_i) + r_i), y_hat = sum_i a_qi (y_i + dy_i). Conditions: loss diff_only (the historical
# objective: mean squared pair difference, uniform over retrieved pairs) and combined (lambda 1/1: plus the final task
# loss, cross-entropy of s_q or squared error of y_hat). Same frozen trained core, LOO training neighborhoods, adapter
# budget, lr, patience and hidden sizes as the recorded aggregate adapters of the same experiment.
# plan_full_r760 reuse_regression__regression unchanged except experiment, status, seeds 30-32 and the conditions.
# Compared with the recorded plan_full aggregate units of the same tasks and hosts.
# Hosts (one per dataset, those of the plan_full reuse_regression rows): q-lab: energy_efficiency, student_performance, tabarena_363625, tabarena_363675; r760: abalone, car, wine; xps8960: airfoil, body_fat, diabets, yacht.
