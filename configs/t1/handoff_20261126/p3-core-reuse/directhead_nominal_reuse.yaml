# Handoff 2026-11-26 pack p3. Every value chosen here is exploratory, our choice, not a PI decision (owner's order 2026-11-26).
# Item (c): a direct neural classification head as a capacity reference, reported separately (T1_IMPLEMENTATION_HANDOFF:
# "A direct neural classification head may be included as a capacity reference, but it is not an adaptation method
# and must be reported separately"; plan section 5.3 leakage/capacity control). Its own experiment and study.
# Declared head (model/t1/reuse_variants.py, output_mode direct_head): class logits = g(z_q), z_q the frozen trained
# core's query representation (the features retrieval uses), same hidden sizes, lr, epochs and patience as the
# recorded adapters, cross-entropy only (loss cls_only), best validation loss; retrieval is not used for the decision
# (the row's pre metrics are still the retrieval-only p0). The query's uncovered nominal one-hot groups (color, shape) are inputs too, so the head sees what the
# adapter sees; size is in X.
# plan_full_r760 nominal_reuse__classification unchanged except experiment, status, seeds 30-32 and the condition.
# Hosts (one per dataset, those of the plan_full nominal_reuse rows): r760: synthetic_nominal.
# Study handoff_directhead_r760.
status: exploratory_handoff_20261126_p3
specification_commit: cd77277600841438d98ac5793867da28b8ec6dd0
pipeline_revision: pi_20260920_v2
torch_threads: 1
splits:
  test_frac: 0.2
  val_frac: 0.2
  maint_frac: 0.0
  reg_cohort_bins: 5
core:
  representation: raw
  glocal_fw_set_num: 1
  tau: 1.0
  top_k: 5
  pre_topk_mask: true
  case_normalizer: softmax
  lr_case: 0.01
  lr_glocal: 0.01
  lr_feature: 0.001
  epochs: 300
  patience: 40
  batch_size: 32
  bias_init: knn_mean
  bias_init_k: 5
statistics:
  source: train_loo
  accumulation: per_checkpoint
  counterfactual: false
  smoothing: 1.0
  min_retrieval_count: 2
  min_activation_mass: 0.1
  bias_normalization: within_cohort_percentile
  bias_source: current
  regression_success_tolerance: 0.5
retention:
  policy: provenance_only
  min_per_cohort: 2
  protect_rare_cohort_below: 0
  boundary_protect_fraction: 0.0
  activation_threshold: 0.05
  zero_reachability: zero
  cache_activation_threshold: 0.05
  allowed_loss_increase: 0.05
experiment: directhead_nominal_reuse__classification
type: reuse
seeds:
- 30
- 31
- 32
datasets:
- name: synthetic_nominal
  task_type: classification
reuse:
  lambda_diff: 1.0
  lambda_cls: 1.0
  probability_mode: softmax
  epochs: 30
  patience: 15
  lr: 0.001
  hidden_dims:
  - 32
  - 16
  nominal_fields_covered_by_representation: false
  nominal_fields:
  - name: color
    covered_by_representation: false
  - name: shape
    covered_by_representation: false
  - name: size
    covered_by_representation: true
conditions:
- output_mode: direct_head
  loss: cls_only
