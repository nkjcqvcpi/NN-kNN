# Stage A of the NN-kNN neural CBR training-schedule search (retrieval + reuse).
# Each task starts from its validation-selected NN-kNN core (tools/t1_schedule_search.py
# prepare embeds core_by_dataset from the HPO grid). Candidates differ in how
# retrieval and the reuse adapter are trained after (or without) the core:
#   frozen reuse      adapter on a frozen core (reuse_conditions)
#   sequential        more retrieval on L_pre, then the adapter (independent)
#   alternating       blocks of L_R and L_A updates
#   joint             both components every minibatch (end to end)
#   joint_scratch     joint from the untrained initialization, no core pretraining
# Development seeds rank candidates by validation only; confirmation uses fresh
# seeds 30-34 (schedule_search_confirm_20261011.yaml).
base: _base.yaml
experiment: schedule_search_20261011
type: encoder_ablation
status: exploratory_validation_search
seeds: [20, 21]
core: {epochs: 300, patience: 40}
arms:
  - {name: tuned}
reuse: {lambda_diff: 1.0, lambda_cls: 1.0, probability_mode: softmax, epochs: 300, patience: 30, lr: 0.001}
reuse_conditions:
  - {output_mode: nominal_residual_scores, loss: combined}
sync: {s_task: 0.5, retrieval_lr_scale: 0.1, w_pre: 1.0, w_post: 0.5, w_near: 0.1, v_post: 1.0, v_delta: 1.0, v_small: 0.1,
       epochs: 120, block_epochs: 2, patience: 30, probability_mode: softmax, adapter_lr: 0.001}
conditions:
  - {name: alternating_default, schedule: alternating_rr}   # current T1 default (reference)
condition_grid:
  - name: sequential
    fixed: {schedule: independent}
    grid: {retrieval_lr_scale: [0.1, 0.3, 1.0]}
  - name: alternating
    fixed: {schedule: alternating_rr}
    grid: {block_epochs: [1, 5], retrieval_lr_scale: [0.1, 0.3, 1.0]}
  - name: alternating_b2
    fixed: {schedule: alternating_rr, block_epochs: 2}
    grid: {retrieval_lr_scale: [0.3, 1.0]}
  - name: joint
    fixed: {schedule: joint_rr}
    grid: {joint_objective: [separated, summed], adapter_warmup_epochs: [0, 5], retrieval_lr_scale: [0.1, 0.3, 1.0]}
  - name: joint_scratch
    fixed: {schedule: joint_rr, core_pretrain: false, retrieval_lr_scale: 1.0, epochs: 300, patience: 40}
    grid: {joint_objective: [separated, summed]}
datasets:
  - {name: iris, task_type: classification}
  - {name: wine, task_type: classification}
  - {name: breast_cancer, task_type: classification}
  - {name: balance, task_type: classification}
  - {name: digits, task_type: classification}
  - {name: zebra, task_type: classification}
  - {name: zebra_special, task_type: classification}
  - {name: tabarena_363614, task_type: classification, display: anneal}
  - {name: tabarena_363626, task_type: classification, display: credit-g}
  - {name: energy_efficiency, task_type: regression}
  - {name: yacht, task_type: regression}
  - {name: airfoil, task_type: regression}
  - {name: student_performance, task_type: regression}
  - {name: abalone, task_type: regression, max_train: 1500}
  - {name: tabarena_363625, task_type: regression, display: concrete_compressive_strength}
  - {name: tabarena_363675, task_type: regression, display: healthcare_insurance_expenses}
